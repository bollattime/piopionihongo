const SVGNS = "http://www.w3.org/2000/svg";
const NPTS = 24;
let strokesLoading = false, strokesWaiters = [];
function loadStrokes(cb){
  if (window.KANJI_STROKES){ cb(); return; }
  strokesWaiters.push(cb);
  if (strokesLoading) return;
  strokesLoading = true;
  const s = document.createElement("script");
  s.src = "strokes.js";
  s.onload = () => { strokesLoading = false; strokesWaiters.splice(0).forEach(f => f()); };
  s.onerror = () => { strokesLoading = false; strokesWaiters = []; setStatus("strokesMissing", "bad"); };
  document.head.appendChild(s);
}

let W = {k: null, ds: [], lens: [], samples: [], idx: 0, miss: 0, total: 0, done: false, timers: [], anims: []};
const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function polyLen(pts){ let s = 0; for (let i = 1; i < pts.length; i++) s += dist(pts[i-1], pts[i]); return s; }
function resample(pts, n){
  if (pts.length === 1) return Array.from({length: n}, () => pts[0].slice());
  const total = polyLen(pts), step = total / (n - 1), out = [pts[0].slice()];
  let acc = 0, prev = pts[0];
  for (let i = 1; i < pts.length && out.length < n; i++){
    let cur = pts[i], d = dist(prev, cur);
    while (d > 0 && acc + d >= step * out.length && out.length < n){
      const r = (step * out.length - acc) / d;
      out.push([prev[0] + (cur[0]-prev[0]) * r, prev[1] + (cur[1]-prev[1]) * r]);
    }
    acc += d; prev = cur;
  }
  while (out.length < n) out.push(pts[pts.length-1].slice());
  return out;
}
function samplePath(p, L){
  const out = [];
  for (let i = 0; i < NPTS; i++){ const q = p.getPointAtLength(L * i / (NPTS - 1)); out.push([q.x, q.y]); }
  return out;
}
const centroid = pts => [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];

// Kullanıcının çizgisi i. çizgiyle eşleşiyor mu? (109×109 koordinat)
function strokeMatches(res, userLen, i){
  const tpl = W.samples[i], L = W.lens[i];
  if (L < 14) return dist(centroid(res), centroid(tpl)) < 16 && userLen < 45;
  if (userLen < L * 0.3) return false;
  const tol = 14 + Math.min(L, 80) * 0.06;   // ~14–19 birim (alanın ~%13–17'si)
  let sum = 0;
  for (let k = 0; k < NPTS; k++) sum += dist(res[k], tpl[k]);
  return sum / NPTS < tol && dist(res[0], tpl[0]) < tol * 1.25 && dist(res[NPTS-1], tpl[NPTS-1]) < tol * 1.25;
}

function setStatus(key, cls, vars){
  const el = $("wStatus");
  el.textContent = key ? t(key, vars) : "";
  el.className = "write-status" + (cls ? " " + cls : "");
}
function clearTimers(){
  W.timers.forEach(clearTimeout); W.timers = [];
  W.anims.forEach(a => { try { a.cancel(); } catch(e){} }); W.anims = [];
  $("padAnim").innerHTML = "";
}
function addNumber(i){
  const p0 = W.samples[i][0];
  const tx = document.createElementNS(SVGNS, "text");
  tx.setAttribute("x", (p0[0] - 4).toFixed(1));
  tx.setAttribute("y", (p0[1] - 1.5).toFixed(1));
  tx.textContent = i + 1;
  $("padNums").appendChild(tx);
}

function renderWrite(){
  renderStudyChips($("writeChips"), renderWrite);
  const locked = isLocked(cardLvl);
  $("writeWrap").hidden = locked;
  $("writeLocked").hidden = !locked;
  if (locked){ clearTimers(); renderLocked($("writeLocked")); return; }
  const c = current();
  $("wMean").textContent = M(c.m);
  $("wRead").textContent = c.easy + romajiSuffix(c.easy);
  $("wCount").textContent = (pos + 1) + " / " + order.length;
  $("padSvg").setAttribute("aria-label", t("padLabel", {k: c.k}));
  $("wGuide").setAttribute("aria-pressed", showGuide);
  $("wNext").classList.remove("pulse");
  loadStrokes(() => setupWrite(c));
}
function setupWrite(c){
  clearTimers();
  const ds = strokeData(c.k);
  W = {k: c.k, ds, lens: [], samples: [], idx: 0, miss: 0, total: 0, done: false, timers: [], anims: [], off: [0, 0], offN: 0};
  ["padGuide", "padDone", "padNums", "padAnim"].forEach(id => $(id).innerHTML = "");
  $("padInk").setAttribute("d", "");
  const guide = $("padGuide");
  guide.classList.toggle("off", !showGuide);
  ds.forEach(d => {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d);
    guide.appendChild(p);
    const L = p.getTotalLength();
    W.lens.push(L);
    W.samples.push(samplePath(p, L));
  });
  if (!ds.length) setStatus("noStrokes", "bad");
  else setStatus("wStroke", "", {i: 1, n: ds.length});
}

let drawing = null;
function padPoint(e){
  const r = $("padSvg").getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * 109, (e.clientY - r.top) / r.height * 109];
}
function drawInk(pts){
  $("padInk").classList.remove("bad");
  $("padInk").setAttribute("d", pts.length ? "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") : "");
}
function finishStroke(pts){
  if (!W.ds.length || W.done) return;
  const len = polyLen(pts);
  if (len < 2 && W.lens[W.idx] >= 14){ drawInk([]); return; }  // yanlışlıkla dokunma
  const raw = resample(pts, NPTS);
  // Kullanıcının kanjiyi genel olarak kaydırarak yazmasını tolere et
  const res = raw.map(q => [q[0] - W.off[0], q[1] - W.off[1]]);
  if (strokeMatches(res, len, W.idx) || (W.offN > 0 && strokeMatches(raw, len, W.idx))){
    const cu = centroid(raw), ct = centroid(W.samples[W.idx]);
    W.offN++;
    const clamp = v => Math.max(-12, Math.min(12, v));
    W.off = [clamp(W.off[0] + ((cu[0] - ct[0]) - W.off[0]) / W.offN), clamp(W.off[1] + ((cu[1] - ct[1]) - W.off[1]) / W.offN)];
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", W.ds[W.idx]);
    $("padDone").appendChild(p);
    addNumber(W.idx);
    W.idx++; W.miss = 0;
    drawInk([]);
    $("padAnim").innerHTML = "";
    if (W.idx >= W.ds.length) completeWrite();
    else setStatus("wStroke", "", {i: W.idx + 1, n: W.ds.length});
  } else {
    W.miss++; W.total++;
    let later = false;
    for (let j = W.idx + 1; j < W.ds.length && !later; j++) later = strokeMatches(res, len, j);
    $("padInk").classList.add("bad");
    W.timers.push(setTimeout(() => drawInk([]), 380));
    setStatus(later ? "wOrder" : "wWrong", "bad", {i: W.idx + 1});
    if (W.miss >= 3) animateStrokes([W.idx], true);
  }
}
function completeWrite(){
  W.done = true;
  written[W.k] = (written[W.k] || 0) + 1;
  store.set("kanji-written", written);
  countAction();
  if (W.total) setStatus("wDoneMiss", "ok", {m: W.total}); else setStatus("wDone", "ok");
  $("wNext").classList.add("pulse");
  if (autoAdvance){
    const k = W.k;
    W.timers.push(setTimeout(() => { if (view === "write" && W.k === k) { stepCard(1); renderWrite(); } }, 1100));
  }
}
function animateStrokes(list, hint){
  clearTimers();
  const g = $("padAnim");
  let delay = 0;
  list.forEach(i => {
    const p = document.createElementNS(SVGNS, "path");
    const L = W.lens[i];
    p.setAttribute("d", W.ds[i]);
    if (hint) p.classList.add("hint");
    p.style.strokeDasharray = L;
    p.style.strokeDashoffset = L;
    g.appendChild(p);
    const dur = Math.max(320, L * 9);
    if (p.animate){
      W.anims.push(p.animate([{strokeDashoffset: L}, {strokeDashoffset: 0}], {duration: dur, delay, fill: "forwards", easing: "ease-in-out"}));
    } else {
      p.style.strokeDashoffset = 0;
    }
    delay += dur + 120;
  });
  W.timers.push(setTimeout(() => { g.innerHTML = ""; }, delay + (hint ? 500 : 900)));
}

const JLPT5 = ["N5","N4","N3","N2","N1"];
const TOPICS = ["greet","people","body","food","home","time","nature","town","shop","work","hobby","feel","verb","adj","adv"];
const PHR_TOPICS = ["greet","polite","shop","food","travel","work","home","feel","phone","trouble"];
let studyLoading = false, studyWaiters = [];
const ST = () => window.PIO_STUDY || {grammar: {}, conv: [], phrases: [], words: []};
function loadStudy(cb){
  if (window.PIO_STUDY){ cb(); return; }
  if (window.__pioStudyP){ window.__pioStudyP.then(() => cb(), () => toast(t("studyLoadFail"))); return; }
  studyWaiters.push(cb);
  if (studyLoading) return;
  studyLoading = true;
  const s = document.createElement("script");
  s.src = "study.js";
  s.onload = () => { studyLoading = false; const w = studyWaiters; studyWaiters = []; w.forEach(f => { try { f(); } catch(e){} }); };
  s.onerror = () => { studyLoading = false; studyWaiters = []; toast(t("studyLoadFail")); };
  document.head.appendChild(s);
}
let GP_INDEX = null;   // gramer kalıbı -> {lv, id}
function gpIndex(){
  if (GP_INDEX || !window.PIO_STUDY) return GP_INDEX || {};
  GP_INDEX = {};
  const clean = p => p.replace(/[〜～]/g, "").replace(/（[^）]*）/g, "").trim();
  JLPT5.forEach(l => (ST().grammar[l] || []).forEach(g => {
    GP_INDEX[g.p] = GP_INDEX[g.p] || {lv: l, id: g.id};
    clean(g.p).split("・").forEach(x => { if (x && !GP_INDEX[x]) GP_INDEX[x] = {lv: l, id: g.id}; });
  }));
  return GP_INDEX;
}
function findGrammar(p){
  const ix = gpIndex();
  if (ix[p]) return ix[p];
  const c = p.replace(/[〜～]/g, "").replace(/（[^）]*）/g, "").trim();
  return ix[c] || null;
}
function spkBtn(text){
  const b = document.createElement("button");
  b.className = "speak-sm";

let wTopic = store.get("kanji-w-topic", "all"), wShown = 0, wItems = [], wObs = null, ALLW = null;
function openWords(){ if (view === "words") renderWords(); else setView("words"); }
function dailyWordObjs(l){
  return ST().words.filter(x => x.lv === l).map(x => ({w: x.w, r: x.r, pos: x.pos || "", m: {tr: x.tr, en: x.en}, tp: x.tp}));
}
function jlptWordObjs(l){
  const seen = new Set(), out = [];
  KANJI.forEach(c => { if (c.lvl === l) c.words.forEach(w => { const k = wordKey(w); if (!seen.has(k)){ seen.add(k); out.push(Object.assign({tp: "kanji"}, w)); } }); });
  return out;
}
function allWords(){
  const sig = KANJI.length + ":" + !!window.PIO_STUDY;
  if (ALLW && ALLW.sig === sig) return ALLW;
  const seen = new Set(), out = [];
  const add = (w, lv) => { const k = wordKey(w); if (seen.has(k)) return; seen.add(k); w.lv = lv; out.push(w); };
  JLPT5.forEach(l => { dailyWordObjs(l).forEach(w => add(w, l)); jlptWordObjs(l).forEach(w => add(w, l)); });
  jlptWordObjs("G").forEach(w => add(w, "G"));
  out.sig = sig;
  return (ALLW = out);
}
function wordRow(w, plain){
  const b = document.createElement("div"); b.className = "wrow" + (plain ? "" : " glass"); b.setAttribute("role", "button"); b.tabIndex = 0;
  b.innerHTML = '<span class="ww"><b lang="ja"></b><small lang="ja"></small></span><span class="wm"></span>';
  b.querySelector("b").textContent = w.w;
  const lv = w.lv ? (w.lv === "G" ? t("levelG") : w.lv) : "";
  b.querySelector("small").textContent = [w.r !== w.w ? w.r : "", lv].filter(Boolean).join(" · ");
  b.querySelector(".wm").textContent = M(w.m) || t("noTrShort");

}
function appendWordRows(){
  const list = $("wList"), sent = $("wSentinel");
  const end = Math.min(wItems.length, wShown + 200), frag = document.createDocumentFragment();
  for (let i = wShown; i < end; i++) frag.appendChild(wordRow(wItems[i]));
  wShown = end;
  list.insertBefore(frag, sent);
  sent.hidden = wShown >= wItems.length;
}
function renderWords(){
  if (view === "words") $("title").textContent = t("wordsNav");
  $("wSearch").placeholder = t("wordsSearch");
  const list = $("wList"); list.innerHTML = ""; $("wCount").textContent = "";
  if (!window.PIO_STUDY){ loadingNote(list); loadStudy(() => { if (view === "words") renderWords(); }); return; }
  if (!dictLoaded) loadDict(() => { ALLW = null; if (view === "words") renderWords(); });
  const all = allWords();
  const counts = {all: all.length};
  all.forEach(w => { counts[w.tp] = (counts[w.tp] || 0) + 1; });
  if (!counts[wTopic]) wTopic = "all";
  const tEl = $("wTopics"); tEl.innerHTML = "";
  ["all", ...TOPICS, "kanji"].forEach(tp => {
    if (!counts[tp]) return;
    const b = document.createElement("button"); b.className = "chip glass";
    b.setAttribute("aria-pressed", tp === wTopic);
    b.innerHTML = "<span></span><small></small>";
    b.firstChild.textContent = t("wtp_" + tp); b.lastChild.textContent = counts[tp].toLocaleString(lang === "tr" ? "tr" : "en");
    b.addEventListener("click", () => { wTopic = tp; store.set("kanji-w-topic", tp); renderWords(); document.querySelector(".sec-words").scrollTo(0, 0); });
    tEl.appendChild(b);
  });
  const raw = $("wSearch").value.trim(), q = norm(raw);
  const kana = /^[a-zA-Z\s-]+$/.test(raw) && raw.length > 1 ? toHira(romajiToKana(raw.replace(/\s+/g, "").toLowerCase())) : "";
  const key = "_n" + lang;
  wItems = all.filter(w => (wTopic === "all" || w.tp === wTopic) &&
    (!q || (w[key] || (w[key] = norm(w.w + " " + w.r + " " + M(w.m)))).includes(q) || (kana && toHira(w.r).startsWith(kana))));
  if (kana) wItems.sort((x, y) => (toHira(y.r) === kana) - (toHira(x.r) === kana));
  $("wCount").textContent = t("wordsCountAll", {n: wItems.length.toLocaleString(lang === "tr" ? "tr" : "en")});
  const sent = document.createElement("div"); sent.id = "wSentinel"; sent.className = "muted-note"; sent.textContent = "…";
  list.appendChild(sent);
  wShown = 0; appendWordRows();
  if (!wItems.length){ const p = document.createElement("p"); p.className = "empty"; p.textContent = t("wordsEmpty"); list.insertBefore(p, sent); }
  if (wObs) wObs.disconnect();
  if ("IntersectionObserver" in window){
    wObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && wShown < wItems.length) appendWordRows(); },
      {root: document.querySelector(".sec-words"), rootMargin: "600px"});
    wObs.observe(sent);
  } else {
    sent.textContent = t("showMore", {n: ""}); sent.onclick = appendWordRows;
  }
}

  $("qsStart").disabled = !n;
}
let VPOOL = {};
function vocabPool(l){
  if (VPOOL[l] && VPOOL[l].study === !!window.PIO_STUDY) return VPOOL[l];
  const seen = new Set(), out = [];
  const add = w => { const k = wordKey(w); if (seen.has(k) || !M(w.m)) return; seen.add(k); out.push(w); };
  if (window.PIO_STUDY) dailyWordObjs(l).forEach(add);
  jlptWordObjs(l).forEach(add);
  out.study = !!window.PIO_STUDY;
  return (VPOOL[l] = out);
}
function quizPool(){
  const lvls = QS.lv.filter(l => !isLocked(l)), items = [];
  if (QS.ty.includes("k")) KANJI.forEach(c => { if (lvls.includes(c.lvl)) items.push({t: "k", key: "k:" + c.k, c, lv: c.lvl}); });
  if (QS.ty.includes("v")) lvls.forEach(l => vocabPool(l).forEach(w => items.push({t: "v", key: "v:" + wordKey(w), w, lv: l})));
  if (QS.ty.includes("g") && window.PIO_STUDY) lvls.forEach(l => (ST().grammar[l] || []).forEach(g => g.q.forEach((q, i) => items.push({t: "g", key: "g:" + g.id + ":" + i, g, q, lv: l}))));
  return QS.only ? items.filter(x => qres[x.key] !== 1) : items;
}
function startQuiz(list){
  let items;
  if (list) items = shuffleArr(list.slice());
  else {
    const pool = quizPool(), by = {};
    pool.forEach(x => (by[x.t] = by[x.t] || []).push(x));
    Object.values(by).forEach(shuffleArr);
    const kinds = Object.keys(by); items = [];
    while (items.length < QS.max && kinds.some(k => by[k].length)){
      for (const k of kinds){ if (by[k].length && items.length < QS.max) items.push(by[k].pop()); }
    }
    shuffleArr(items);
  }
  if (!items.length){ toast(t("qsNone")); return; }
  QZ = {items, i: 0, right: 0, wrong: 0, wrongs: [], answered: false};
  prepQ(); renderQuiz();
  document.querySelector(".sec-quiz").scrollTo(0, 0);
}
function pickDistinct(pool, n, keyFn, exclude){
  const seen = new Set(exclude), out = [];
  for (const x of shuffleArr(pool.slice())){
    if (out.length >= n) break;
    const k = keyFn(x);
    if (!k || seen.has(k)) continue;
    seen.add(k); out.push(x);
  }
  return out;
}
function prepQ(){
  const it = QZ.items[QZ.i];
  QZ.answered = false; QZ.picked = null;
  let opts = [];
  if (it.t === "k"){
    it.mode = Math.random() < 0.5 ? "k2m" : "m2k";
    const wrong = pickDistinct(KANJI.filter(x => x.lvl === it.c.lvl && x.k !== it.c.k), 3, x => M(x.m), [M(it.c.m)]);
    opts = [it.c, ...wrong].map(x => ({label: it.mode === "k2m" ? M(x.m) : x.k, ok: x === it.c, jp: it.mode !== "k2m", big: it.mode !== "k2m"}));
  } else if (it.t === "v"){
    it.mode = Math.random() < 0.5 ? "w2m" : "m2w";
    const wrong = pickDistinct(vocabPool(it.lv).filter(x => wordKey(x) !== wordKey(it.w)), 3, x => it.mode === "w2m" ? M(x.m) : x.w, [it.mode === "w2m" ? M(it.w.m) : it.w.w]);
    opts = [it.w, ...wrong].map(x => ({label: it.mode === "w2m" ? M(x.m) : x.w, ok: x === it.w, jp: it.mode === "m2w"}));
  } else {
    opts = [{label: it.q.a, ok: true, jp: true}, ...it.q.o.map(o => ({label: o, ok: false, jp: true}))];
  }
  QZ.opts = shuffleArr(opts);
}
function drawQ(){
  const it = QZ.items[QZ.i], n = QZ.items.length, ans = QZ.answered;
  $("qProgress").textContent = (QZ.i + 1) + " / " + n;
  $("qScore").textContent = "✓ " + QZ.right + "   ✗ " + QZ.wrong;
  $("qType").textContent = t("qty_" + it.t) + " · " + it.lv;
  const pr = $("qPrompt"), sp = $("qSpeak");
  pr.innerHTML = ""; pr.className = "q-prompt";
  let speakText = "", label = "", answer = "";
  if (it.t === "k"){

    label = t(k2m ? "qWhatMeaning" : "qWhichKanji");
    pr.classList.toggle("meaning", !k2m); pr.lang = k2m ? "ja" : lang;
    pr.textContent = k2m ? c.k : M(c.m);
    speakText = k2m || ans ? c.easy : "";
    answer = c.k + "  ·  " + c.easy + romajiSuffix(c.easy) + "  ·  " + M(c.m);
  } else if (it.t === "v"){
    const w = it.w, w2m = it.mode === "w2m";
    label = t(w2m ? "qWordMeaning" : "qWhichWord");
    pr.classList.add(w2m ? "word" : "meaning"); pr.lang = w2m ? "ja" : lang;
    pr.textContent = w2m ? w.w : M(w.m);
    speakText = w2m || ans ? w.r : "";
    answer = w.w + (w.r !== w.w ? "（" + w.r + "）" : "") + romajiSuffix(w.r) + "  ·  " + M(w.m);
  } else {
    const q = it.q;
    label = t("qFillBlank");
    pr.classList.add("sent"); pr.lang = "ja";
    const parts = q.s.split("＿＿");
    pr.append(parts[0]);
    const bl = document.createElement("span"); bl.className = "blank"; bl.textContent = ans ? q.a : "　";
    pr.append(bl, parts[1] || "");
    speakText = ans ? q.s.replace("＿＿", q.a) : "";
    answer = M(q) + "\n" + it.g.p + " — " + M(it.g.m);
  }
  $("qLabel").textContent = label;
  sp.hidden = !speakText;
  sp.onclick = () => speak(speakText, sp);
  $("qAnswer").textContent = ans ? answer : "";
  $("qAnswer").style.whiteSpace = "pre-line";
  const box = $("qOptions"); box.innerHTML = "";
  QZ.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "q-opt glass" + (o.big ? " kanji-opt" : o.jp ? " jp" : "");
    if (o.jp) b.lang = "ja";
    b.textContent = o.label;
    b.disabled = ans;
    if (ans){ if (o.ok) b.classList.add("right"); else if (o === QZ.picked) b.classList.add("wrong"); }

    box.appendChild(b);

}
function answerQ(o){
  if (!QZ || QZ.answered) return;
  const it = QZ.items[QZ.i];
  QZ.answered = true; QZ.picked = o;
  qres[it.key] = o.ok ? 1 : 0;
  store.set("kanji-qres", qres);
  if (it.t === "k"){
    const s = srs[it.c.k] || [0, 0];
    const bx = o.ok ? Math.min(s[0] + 1, INTERVALS.length - 1) : 0;
    srs[it.c.k] = [bx, Date.now() + INTERVALS[bx]];
    store.set("kanji-srs", srs);
  }

  drawQ();
  if (QS.auto){
    const idx = QZ.i, qz = QZ;

}
function nextQ(){

function renderStats(){
  renderDailyGoal();
  const body = $("statsBody");
  body.innerHTML = "";
  const now = Date.now();
  const learnedAll = Object.values(srs).filter(s => s[0] >= 3).length;
  const writtenAll = Object.keys(written).length;
  const sum = document.createElement("div");
  sum.className = "stat-sum";
  [[streak(), "statsStreak"], [learnedAll, "statsLearned"], [writtenAll, "statsWritten"]].forEach(([n, key]) => {
    const d = document.createElement("div");
    d.className = "stat-box glass";
    d.innerHTML = "<b></b><span></span>";
    d.querySelector("b").textContent = n;
    d.querySelector("span").textContent = t(key);
    sum.appendChild(d);
  });

  LEVELS.forEach(l => {
    const list = KANJI.filter(c => c.lvl === l);

    let learned = 0, studied = 0, due = 0, wrote = 0;
    list.forEach(c => {
      const s = srs[c.k];
      if (s){ studied++; if (s[0] >= 3) learned++; if (s[1] <= now) due++; }
      if (written[c.k]) wrote++;

    const row = document.createElement("div");

    if (isLocked(l)) row.querySelector("h3 span").appendChild(eggLock());
    row.querySelector("h3 small").textContent = t("statsLvlLine", {done: learned, total: list.length});
    row.querySelector(".bar i").style.width = (learned / list.length * 100).toFixed(1) + "%";
    const ps = row.querySelectorAll("p span");
    ps[0].textContent = t("statsStudied", {n: studied});

let sx = null, dx = 0;
card.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  sx = e.clientX; dx = 0; card.classList.add("dragging");
});

  dx = e.clientX - sx;
  card.style.transform = "translateX(" + dx*0.6 + "px) rotate(" + dx*0.02 + "deg)";
});

  if (sx === null) return;
  card.classList.remove("dragging"); sx = null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); else card.style.transform = "";
};

// ---- Tema (Sistem / Açık / Koyu) ve Mevsim (Otomatik / 春 夏 秋 冬) ----
let themePref = store.get("kanji-theme", "system");
let seasonPref = store.get("kanji-season", "auto");
let splashSound = store.get("kanji-splash-sound", true);
const SEASONS = ["spring","summer","autumn","winter"];
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function effTheme(){ return themePref === "system" ? (darkMQ && darkMQ.matches ? "dark" : "light") : themePref; }
function curSeason(){ return SEASONS.includes(seasonPref) || seasonPref === "classic" ? seasonPref : window.pioAutoSeason(); }
function paintTheme(){
  const r = document.documentElement;
  if (themePref === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", themePref);
  r.setAttribute("data-eff", effTheme());
  r.setAttribute("data-season", curSeason());
  document.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeOpt === themePref));
  document.querySelectorAll("#seasonSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.seasonOpt === seasonPref));
  const n = $("seasonNow");
  if (n) n.textContent = t("seasonNow", {s: t("season_" + window.pioAutoSeason())});
}
// Işık düğmesi gibi: yeni görünüm dokunulan noktadan daire şeklinde yayılır
function swirl(change, ev){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ change(); return; }
  const r = document.documentElement;
  if (!document.startViewTransition){
    // Eski WebView: renkler yavaşça geçsin
    r.classList.add("theming"); change();
    clearTimeout(window.__thT); window.__thT = setTimeout(() => r.classList.remove("theming"), 1300);
    return;
  }
  const vt = document.startViewTransition(change);
  vt.ready.then(() => {
    const o = {duration: 1200, easing: "cubic-bezier(.4,0,.2,1)", fill: "both"};
    r.animate({opacity: [0, 1]}, Object.assign({pseudoElement: "::view-transition-new(root)"}, o));
    r.animate({opacity: [1, 0]}, Object.assign({pseudoElement: "::view-transition-old(root)"}, o));
  }).catch(() => {});
}
function setTheme(pref, ev){
  const before = effTheme(); themePref = pref; store.set("kanji-theme", pref);
  if (effTheme() === before) paintTheme(); else swirl(paintTheme, ev);
}
function setSeason(pref, ev){
  const before = curSeason(); seasonPref = pref; store.set("kanji-season", pref);
  if (curSeason() === before) paintTheme(); else swirl(paintTheme, ev);
}
paintTheme();
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener("change", () => { if (themePref === "system") paintTheme(); });
// Uygulama açık kalırken ay değişirse (otomatik modda) mevsim de değişsin

document.querySelectorAll("#seasonSeg button").forEach(b => b.addEventListener("click", ev => setSeason(b.dataset.seasonOpt, ev)));

// ---- Sayfa değişince köşeden civciv bakar ----
let peepTimer = 0, lastPeepView = null;
function peep(v){
  if (lastPeepView === null){ lastPeepView = v; return; }
  if (v === lastPeepView) return;
  lastPeepView = v;
  const el = $("peep"); if (!el) return;
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  clearTimeout(peepTimer); peepTimer = setTimeout(() => el.classList.remove("go"), 1100);
}

// ---- Notlar (sadece bu cihazda saklanır) ----
let notes = store.get("kanji-notes", null);
if (!Array.isArray(notes)){
  notes = [];
  const old = store.get("kanji-note", "");
  if (old) notes.push({id: Date.now(), text: old, t: Date.now()});
  store.set("kanji-notes", notes);
}
let editingNote = null, confirmingNoteDel = false;
function noteDate(ms){
  try { return new Date(ms).toLocaleString(lang === "tr" ? "tr-TR" : "en-US", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}); } catch(e){ return ""; }
}
function renderNotes(){
  const ul = $("noteList"); ul.innerHTML = "";
  notes.slice().sort((a, b) => b.t - a.t).forEach(n => {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.className = "note-item glass";
    const lines = n.text.split("\n"); const title = lines[0].slice(0, 80); const rest = lines.slice(1).join("\n").trim();
    b.innerHTML = "<b></b><span></span><small></small>";
    b.querySelector("b").textContent = title;
    b.querySelector("span").textContent = rest;
    b.querySelector("small").textContent = noteDate(n.t);
    b.addEventListener("click", () => openNote(n.id));
    li.appendChild(b); ul.appendChild(li);
  });
  $("notesEmpty").hidden = notes.length > 0;
  $("noteCount").textContent = notes.length ? notes.length : "";
}
function openNote(id){
  editingNote = id || null; confirmingNoteDel = false;
  const n = id ? notes.find(x => x.id === id) : null;
  $("noteEditor").value = n ? n.text : "";
  $("noteEditor").placeholder = t("notePlaceholder");
  $("noteDelBtn").hidden = !n; $("noteDelBtn").textContent = t("noteDelete");
  $("noteScrim").hidden = false; $("noteSheet").hidden = false;
  setTimeout(() => $("noteEditor").focus(), 60);
}
function closeNote(){ $("noteScrim").hidden = true; $("noteSheet").hidden = true; editingNote = null; }
function saveNoteItem(){
  const text = $("noteEditor").value.replace(/\s+$/, "");
  if (!text.trim()){ if (editingNote) deleteNote(editingNote); closeNote(); return; }
  const n = editingNote ? notes.find(x => x.id === editingNote) : null;
  if (n){ n.text = text; n.t = Date.now(); } else notes.push({id: Date.now(), text, t: Date.now()});
  store.set("kanji-notes", notes); closeNote(); renderNotes(); toast(t("noteSaved"));
}
function deleteNote(id){ notes = notes.filter(x => x.id !== id); store.set("kanji-notes", notes); renderNotes(); }
$("addNoteBtn").addEventListener("click", () => openNote(null));
$("noteSave2").addEventListener("click", saveNoteItem);
$("noteScrim").addEventListener("click", saveNoteItem);
$("noteDelBtn").addEventListener("click", () => {
  if (!confirmingNoteDel){ confirmingNoteDel = true; $("noteDelBtn").textContent = t("noteDeleteConfirm"); return; }
  deleteNote(editingNote); closeNote(); toast(t("noteDeleted"));
});

// ---- Yedekleme: dosya kullanıcının telefonuna veya kendi Google Drive'ına kaydedilir; hiçbir sunucuya gitmez ----
let pendingRestore = null;
function collectBackup(){
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (/^(kanji-|n5-)/.test(k)) data[k] = localStorage.getItem(k); } } catch(e){}
  return {app: "pio-pio-nihongo", format: 1, created: new Date().toISOString(), data};
}
function countOf(raw){
  try { const v = JSON.parse(raw); if (Array.isArray(v)) return v.length; if (v && typeof v === "object") return Object.keys(v).length; } catch(e){}
  return 0;
}
function summary(data){
  const favs = countOf(data["kanji-favs"]) + countOf(data["kanji-wfavs"]);
  return [
    ["restoreFavs", favs],
    ["restoreSrs", countOf(data["kanji-srs"])],
    ["restoreWritten", countOf(data["kanji-written"])],
    ["restoreDays", countOf(data["kanji-days"])],
    ["restoreNotes", countOf(data["kanji-notes"])]
  ];
}
function backupName(){ const d = new Date(); const z = n => String(n).padStart(2, "0"); return "PioPio-yedek-" + d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()) + ".json"; }
$("backupBtn").addEventListener("click", () => {
  const json = JSON.stringify(collectBackup());
  if (window.AndroidBackup && window.AndroidBackup.save){ try { window.AndroidBackup.save(backupName(), json); } catch(e){ toast(t("backupFailed")); } return; }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], {type: "application/json"}));
    a.download = backupName(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(t("backupSaved"));
  } catch(e){ toast(t("backupFailed")); }
});
window.onBackupSaved = ok => toast(ok ? t("backupSaved") : t("backupFailed"));
$("restoreBtn").addEventListener("click", () => {
  if (window.AndroidBackup && window.AndroidBackup.open){ try { window.AndroidBackup.open(); } catch(e){} return; }
  $("restoreFile").value = ""; $("restoreFile").click();
});
$("restoreFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => window.onBackupFile(String(r.result || "")); r.readAsText(f);
});
window.onBackupFile = text => {
  let b = null;
  try { b = JSON.parse(text); } catch(e){}
  if (!b || b.app !== "pio-pio-nihongo" || !b.data || typeof b.data !== "object"){ toast(t("backupInvalid")); return; }
  pendingRestore = b;
  const cur = collectBackup().data, a = summary(b.data), c = summary(cur);
  const rows = [["restoreDate", noteDate(Date.parse(b.created)), "—"]].concat(a.map((x, i) => [x[0], x[1], c[i][1]]));
  const tb = $("restoreRows"); tb.innerHTML = "";
  rows.forEach(([k, v1, v2]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<th></th><td></td><td></td>";
    tr.children[0].textContent = t(k); tr.children[1].textContent = v1; tr.children[2].textContent = v2;
    if (typeof v1 === "number" && v1 > v2) tr.children[1].className = "newer";
    if (typeof v2 === "number" && v2 > v1) tr.children[2].className = "newer";
    tb.appendChild(tr);
  });
  $("restoreBox").hidden = false;
  $("restoreBox").scrollIntoView({behavior: "smooth", block: "center"});
};
$("restoreCancel").addEventListener("click", () => { pendingRestore = null; $("restoreBox").hidden = true; });
$("restoreApply").addEventListener("click", () => {
  if (!pendingRestore) return;
  try {
    const keep = [];
    for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (/^(kanji-|n5-)/.test(k)) keep.push(k); }
    keep.forEach(k => localStorage.removeItem(k));
    Object.keys(pendingRestore.data).forEach(k => { if (/^(kanji-|n5-)/.test(k)) localStorage.setItem(k, String(pendingRestore.data[k])); });
    toast(t("restoreDone"));
    setTimeout(() => location.reload(), 700);
  } catch(e){ toast(t("backupFailed")); }
});

// ---- Birleştirerek geri yükleme: iki cihazın ilerlemesi toplanır, hiçbir şey silinmez ----
const J = raw => { try { return JSON.parse(raw); } catch(e){ return undefined; } };
function mergeProgress(cur, bak){
  const out = Object.assign({}, cur);
  const union = (a, b, limit) => { const r = [...(Array.isArray(a) ? a : [])]; (Array.isArray(b) ? b : []).forEach(x => { if (!r.includes(x)) r.push(x); }); return limit ? r.slice(0, limit) : r; };
  Object.keys(bak).forEach(k => {
    if (!/^(kanji-|n5-)/.test(k)) return;
    const b = J(bak[k]), c = J(cur[k]);
    if (cur[k] === undefined || c === undefined){ out[k] = bak[k]; return; }
    let v;
    switch (k){
      case "kanji-favs": case "kanji-wfavs": case "n5-favs": v = union(c, b); break;
      case "kanji-history": v = union(c, b, 12); break;
      case "kanji-days": v = union(c, b).sort().slice(-400); break;
      case "kanji-srs":
        v = Object.assign({}, b || {}, c || {});
        Object.keys(b || {}).forEach(x => {
          const p = (c || {})[x], q = b[x];
          if (!p) v[x] = q;
          else if (Array.isArray(q) && (q[0] > p[0] || (q[0] === p[0] && q[1] > p[1]))) v[x] = q;
        });
        break;
      case "kanji-written": case "kanji-qres":
        v = Object.assign({}, b || {}, c || {});
        Object.keys(b || {}).forEach(x => { v[x] = Math.max(+((c || {})[x]) || 0, +b[x] || 0); });
        break;
      case "kanji-notes": {
        const m = new Map();
        [...(Array.isArray(b) ? b : []), ...(Array.isArray(c) ? c : [])].forEach(n => {
          if (!n || !n.id) return;
          const o = m.get(n.id);
          if (!o || (n.t || 0) >= (o.t || 0)) m.set(n.id, n);
        });
        v = [...m.values()].sort((x, y) => (y.t || 0) - (x.t || 0));
        break;
      }
      case "kanji-actions": case "kanji-gift-seen": v = Math.max(+c || 0, +b || 0); break;
      case "kanji-daily-count": {
        const dc = J(cur["kanji-daily-date"]), db = J(bak["kanji-daily-date"]);
        v = dc === db ? Math.max(+c || 0, +b || 0) : (db > dc ? b : c);
        if (db > dc) out["kanji-daily-date"] = bak["kanji-daily-date"];
        break;
      }
      case "kanji-daily-date": return;
      case "kanji-gift": {
        const ok = g => g && typeof g.u === "number" && Array.isArray(g.ids) && PioGift.sign(g.u + "|" + g.ids.join(",")) === g.s;
        const gs = [c, b].filter(ok);
        if (!gs.length) return;
        const u = Math.max(...gs.map(g => g.u)), ids = union(gs[0].ids, gs[1] ? gs[1].ids : []).slice(-200);
        v = {u, ids, s: PioGift.sign(u + "|" + ids.join(","))};
        break;
      }
      default: return;   // ayarlar ve bu cihaza özel bilgiler: bu cihazdaki kalsın
    }
    out[k] = JSON.stringify(v);
  });
  return out;
}
$("restoreMerge").addEventListener("click", () => {
  if (!pendingRestore) return;
  try {
    const merged = mergeProgress(collectBackup().data, pendingRestore.data);
    Object.keys(merged).forEach(k => { if (/^(kanji-|n5-)/.test(k)) localStorage.setItem(k, String(merged[k])); });
    toast(t("restoreMerged"));
    setTimeout(() => location.reload(), 800);
  } catch(e){ toast(t("backupFailed")); }
});
