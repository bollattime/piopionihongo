# data/ veya src/ değiştiğinde docs/ klasörünü otomatik yeniden üretir.
# Böylece GitHub'da bir satırı düzenleyip kaydetmen yeterli olur.
name: Veriyi derle

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veriyi doğrula
        run: python3 tools/build.py --check

      - name: Derle
        run: python3 tools/build.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs android/app/src/main/assets
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri derlendi: $(python3 -c 'import json;print(json.load(open("docs/version.json"))["dataVersion"])')"
            git push
            echo "YAYINLA=1" >> "$GITHUB_ENV"
          fi

      # Botun gönderdiği değişiklik GitHub Pages'i kendiliğinden yenilemez; burada yenilenmesini istiyoruz.
      - name: GitHub Pages'i yenile
        if: env.YAYINLA == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages yenileme isteği gönderilemedi; bir sonraki gönderimde güncellenir."
